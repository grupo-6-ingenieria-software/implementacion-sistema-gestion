name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Disparo manual desde la pestaña Actions ("Run workflow"): corre tests y luego release.
  # `bump` elige el incremento de version SOLO en disparo manual. Un push normal a
  # main siempre usa patch (la entrada llega vacia y el step cae al default).
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump de version (solo para disparo manual)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

# Cancel redundant PR runs, but never cancel a run on main (a release may be mid-publish)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Sube la version, la commitea + taggea a main y crea el GitHub Release (vacio).
  # Solo corre al hacer merge/push a main, y solo si build-and-test pasa.
  # Los jobs release-windows y release-macos corren en paralelo despues de este y
  # cada uno sube su artefacto a ese release.
  version:
    name: version
    needs: build-and-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # RELEASE_TOKEN: PAT de un integrante del team con bypass de branch protection
      # (el GITHUB_TOKEN por defecto NO puede saltar la proteccion de main).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Sube la version en package.json. Push a main -> patch (0.1.0 -> 0.1.1 ...).
      # Disparo manual -> usa el input `bump` (patch/minor/major), p.ej. minor para
      # cerrar un incremento (0.1.20 -> 0.2.0).
      - name: Bump version
        id: bump
        run: |
          npm version "${{ github.event.inputs.bump || 'patch' }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Commitea el bump + tag a main. [skip ci] evita re-disparar este workflow (sin loop).
      # El tag se pushea explicito: `git tag` crea un tag liviano y `--follow-tags`
      # solo empuja tags anotados. `--atomic`: main y tag entran juntos o ninguno.
      - name: Commit, tag and push bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push --atomic origin "HEAD:main" "refs/tags/v${{ steps.bump.outputs.version }}"

      # Crear el release aca evita que windows y macos lo creen dos veces en paralelo.
      - name: Create GitHub Release
        run: gh release create "v${{ steps.bump.outputs.version }}" --title "${{ steps.bump.outputs.version }}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # electron-vite build + electron-builder: genera el instalador NSIS (Setup.exe,
  # .blockmap y latest.yml para electron-updater) y lo sube al GitHub Release del
  # tag recien creado.
  release-windows:
    name: release-windows
    needs: version
    runs-on: windows-latest
    steps:
      # Checkout del tag: package.json ya trae la version nueva.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish NSIS installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Inyectadas en el bundle del proceso main por electron.vite.config.ts.
          # Sin esto el exe cae al fallback file:./local.db y no conecta a Turso.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

  # Igual que release-windows, pero genera un .dmg (arm64, Apple Silicon).
  # Sin firma de Apple: al primer arranque abrir con clic derecho -> Abrir.
  release-macos:
    name: release-macos
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish .dmg
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          # Sin certificado de Apple: no buscar identidad de firma en el keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
